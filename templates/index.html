<!DOCTYPE html>
<html>
<head>
    <title>My Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            height: 100%;
            font-family: "Times New Roman", Times, serif;
            background: url("/static/spiderman.jfif") no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }
        .overlay {
            background: linear-gradient(135deg, rgba(90, 0, 0, 0.65), rgba(180, 0, 0, 0.45));
            position: fixed;
            inset: 0;
            z-index: 1;
        }
        .nav-bar {
            position: relative;
            z-index: 3;
            text-align: right;
            padding: 25px 50px;
        }
        .nav-bar a {
            color: #fff;
            text-decoration: none;
            margin-left: 30px;
            font-weight: bold;
            font-size: 18px;
            text-shadow: 0 0 8px rgba(255, 60, 60, 0.6);
            transition: all 0.3s ease;
        }
        .nav-bar a:hover {
            color: #ff9999;
            text-shadow: 0 0 15px rgba(255, 100, 100, 0.9), 0 0 30px rgba(255, 50, 50, 0.5);
        }

        .center-wrapper {
            position: relative;
            z-index: 2;
            display: flex;
            justify-content: center;   /* left-right center */
            align-items: center;       /* up-down center */
            min-height: calc(100vh - 100px); /* space para sa nav */
            padding: 20px;
        }
        .hero-card {
            max-width: 650px;
            width: 100%;
            background: rgba(255, 245, 245, 0.92);
            border-radius: 24px;
            padding: 45px 40px;
            text-align: center;
            box-shadow:
                0 0 0 3px rgba(204, 0, 0, 0.3),
                0 10px 40px rgba(120, 0, 0, 0.45),
                inset 0 0 25px rgba(255, 255, 255, 0.6);
            animation: fadeUp 1s ease forwards;
            opacity: 0;
            transform: translateY(25px);
        }
        @keyframes fadeUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .profile-pic {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #cc0000;
            box-shadow: 0 0 20px rgba(204, 0, 0, 0.5), 0 0 40px rgba(255, 50, 50, 0.3);
            margin-bottom: 25px;
        }
        h1 {
            color: #990000;
            font-size: 38px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(150, 0, 0, 0.15);
        }
        .subtitle {
            color: #770000;
            font-size: 18px;
            margin-bottom: 35px;
            font-style: italic;
        }
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 18px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 14px 28px;
            border-radius: 12px;
            font-size: 17px;
            font-weight: bold;
            text-decoration: none;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            letter-spacing: 0.5px;
        }
        .btn-light {
            background: linear-gradient(135deg, #e64444, #cc2222);
            color: white;
            box-shadow: 0 4px 15px rgba(204, 34, 34, 0.4);
        }
        .btn-light:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 8px 25px rgba(204, 34, 34, 0.5), 0 0 20px rgba(255, 50, 50, 0.35);
        }
        .btn-dark {
            background: linear-gradient(135deg, #990000, #660000);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 0, 0, 0.4);
        }
        .btn-dark:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 8px 25px rgba(102, 0, 0, 0.5), 0 0 20px rgba(180, 0, 0, 0.35);
        }
        .btn-accent {
            background: linear-gradient(135deg, #cc1144, #aa0033);
            color: white;
            box-shadow: 0 4px 15px rgba(170, 0, 51, 0.4);
        }
        .btn-accent:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 8px 25px rgba(170, 0, 51, 0.5), 0 0 20px rgba(220, 20, 80, 0.35);
        }
    </style>
</head>
<body>
    <div class="overlay"></div>

    <div class="nav-bar">
        <a href="/">Home</a>
        <a href="/profile">Profile</a>
        <a href="/works">Works</a>
        <a href="/contact">Contact</a>
    </div>


    <div class="center-wrapper">
        <div class="hero-card">
            <img src="/static/image.jpg" alt="Profile Picture" class="profile-pic">

            <h1>My Website:></h1>
            <p class="subtitle">My website application for DSA!</p>

            <div class="btn-group">
                <a href="/profile" class="btn btn-light">View Profile</a>
                <a href="/works" class="btn btn-dark">Programming Works</a>
                <a href="/contact" class="btn btn-accent">Contact Info</a>
            </div>
        </div>
    </div>
</body>
</html>
