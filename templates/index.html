
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="home-page">

    <div id="loading-screen">
        <div class="loading-content">
            <div class="loading-title">YNO</div>
            <div class="loading-subtitle">MY PORTFOLIO</div>

            <div class="loading-bar">
                <div class="loading-progress"></div>
            </div>

            <div class="loading-message">
                INITIALIZING PORTFOLIO...
            </div>
        </div>
    </div>

    <div class="nav-bar">
        <a href="/">Home</a>
        <a href="/profile">Profile</a>
        <a href="/works">Works</a>
        <a href="/contact">Contact</a>
    </div>

    <div class="overlay"></div>

    <div class="center-wrapper">
        <div class="hero-card">
            <img src="{{ url_for('static', filename='images/images.jpg') }}"
                 alt="Profile Picture"
                 class="profile-pic">

            <h1>My Website:></h1>
            <p class="subtitle">My website application for DSA!</p>

            <div class="btn-group">
                <a href="/profile" class="btn btn-light">View Profile</a>
                <a href="/works" class="btn btn-dark">Programming Works</a>
                <a href="/contact" class="btn btn-accent">Contact Info</a>
            </div>
        </div>
    </div>

    <script>
        window.addEventListener("load", function () {
            const loadingScreen = document.getElementById("loading-screen");

            const elapsed = performance.now();
            const remaining = Math.max(0, 10000 - elapsed);

            setTimeout(function () {
                loadingScreen.classList.add("hidden");
            }, remaining);
        });
    </script>

</body>
</html>
