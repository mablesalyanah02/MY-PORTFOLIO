<!DOCTYPE html>
<html>
<head>
    <title>My Contact</title>
    <style>
        body {
            font-family: Times New Roman, sans-serif;
            background: url("/static/Spidey.jfif") no-repeat center center fixed;
            background-size: cover;
            margin: 0;
            padding: 0;
            color: white;
            min-height: 100vh;
        }

        .overlay {
            background: rgba(150, 0, 0, 0.55);
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .nav-bar {
            position: relative;
            z-index: 2;
            text-align: right;
            padding: 20px 40px;
        }

        .nav-bar a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
            font-weight: bold;
        }

        .nav-bar a:hover {
            text-decoration: underline;
        }

        .container {
            position: relative;
            z-index: 2;
            max-width: 500px;
            margin: 60px auto;
            padding: 0 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.85);
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(100, 0, 0, 0.3);
            text-align: center;
            color: #660000;
        }

        h2 {
            color: #990000;
            margin-top: 0;
            border-bottom: 2px solid #cc3333;
            padding-bottom: 10px;
        }

        .item {
            margin: 15px 0;
            padding: 15px;
            background: rgba(204, 51, 51, 0.15);
            border-radius: 8px;
            text-align: left;
        }

        strong {
            color: #990000;
        }

        .back-btn {
            display: inline-block;
            margin-top: 25px;
            background: #cc3333;
            color: white;
            padding: 10px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
        }

        .back-btn:hover {
            background: #b30000;
        }
    </style>
</head>
<body>
    <div class="overlay"></div>

    <div class="nav-bar">
        <a href="/">Home</a>
        <a href="/profile">Profile</a>
        <a href="/works">Works</a>
        <a href="/contact">Contact</a>
    </div>

    <div class="container">
        <div class="card">
            <h2>My Contact</h2>

            <div class="item">
                <strong>Name:</strong> Alyanah P. Mables
            </div>
            <div class="item">
                <strong>Email:</strong> alyanahmables28@gmail.com
            </div>
            <div class="item">
                <strong>Phone:</strong> 09604072515
            </div>
            <div class="item">
                <strong>Address:</strong> Quezon City, Philippines
            </div>
            <div class="item">
                <strong>GitHub:</strong> github.com/mablesalyanah02
            </div>

            <a href="/" class="back-btn">← Back to Home</a>
        </div>
    </div>
</body>
</html>
