<!DOCTYPE html>
<html>
<head>
    <title>Convert to Uppercase</title>
    <style>
        body {
            font-family: Times New Roman, sans-serif;
            background: url("/static/peter.jfif") no-repeat center center fixed;
            background-size: cover;
            margin: 0;
            padding: 0;
            color: white;
            min-height: 100vh;
        }
        .overlay {
            background: rgba(120, 0, 0, 0.5);
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }
        .nav-bar {
            position: relative; z-index: 2;
            text-align: right;
            padding: 20px 40px;
        }
        .nav-bar a {
            color: white; text-decoration: none;
            margin-left: 25px; font-weight: bold;
        }
        .nav-bar a:hover { text-decoration: underline; }
        .container {
            position: relative; z-index: 2;
            max-width: 600px; margin: 60px auto;
            padding: 0 20px;
        }
        .card {
            background: rgba(255,255,255,0.88);
            border-radius: 20px; padding: 40px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            color: #660000; text-align: center;
        }
        h2 {
            color: #990000; border-bottom: 3px solid #cc3333;
            padding-bottom: 12px; margin-top: 0;
        }
        label {
            display: block; margin: 20px 0 8px;
            font-weight: bold; text-align: left;
        }
        textarea {
            width: 100%; padding: 12px;
            border: 2px solid #cc3333; border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }
        .btn {
            background: #cc3333; color: white;
            padding: 12px 30px; border: none;
            border-radius: 10px; font-weight: bold;
            font-size: 16px; cursor: pointer; margin: 20px 8px 0;
        }
        .btn:hover { background: #b30000; }
        .result-box {
            margin-top: 25px; padding: 20px;
            background: rgba(204,51,51,0.15);
            border-radius: 10px; font-weight: bold; font-size: 18px;
            min-height: 40px;
        }
        .back-btn {
            display: inline-block; margin-top: 25px;
            border: 2px solid #cc3333; color: #cc3333;
            padding: 10px 25px; border-radius: 8px;
            text-decoration: none; font-weight: bold;
        }
        .back-btn:hover { background: #cc3333; color: white; }
    </style>
</head>
<body>
    <div class="overlay"></div>
    <div class="nav-bar">
        <a href="/">Home</a>
        <a href="/profile">Profile</a>
        <a href="/works">Works</a>
        <a href="/contact">Contact</a>
    </div>
    <div class="container">
        <div class="card">
            <h2> Convert to Uppercase</h2>
            <form method="POST">
                <label>Enter your text:</label>
                <textarea name="input_text" rows="5" placeholder="Type something here..."></textarea>
                <button type="submit" class="btn">Convert Now</button>
            </form>
            {% if result %}
            <div class="result-box">
                <strong>Result:</strong><br>{{ result }}
            </div>
            {% endif %}
            <br>
            <a href="/works" class="back-btn">← Back to Works</a>
        </div>
    </div>
</body>
</html>
