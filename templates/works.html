<!DOCTYPE html>
<html>
<head>
    <title>Programming Works</title>
    <style>
        body {
            font-family: Times New Roman, sans-serif;
            background: url("/static/Minimalist.jfif") no-repeat center center fixed;
            background-size: cover;
            margin: 0;
            padding: 0;
            color: white;
            min-height: 100vh;
        }

        .overlay {
            background: rgba(120, 0, 0, 0.5);
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .nav-bar {
            position: relative;
            z-index: 2;
            text-align: right;
            padding: 20px 40px;
        }

        .nav-bar a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
            font-weight: bold;
        }

        .nav-bar a:hover {
            text-decoration: underline;
        }

        .container {
            position: relative;
            z-index: 2;
            max-width: 700px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.88);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            color: #660000;
            text-align: center;
        }

        h2 {
            color: #990000;
            margin-top: 0;
            border-bottom: 3px solid #cc3333;
            padding-bottom: 12px;
        }

        .work-btn {
            display: block;
            background: #cc3333;
            color: white;
            padding: 15px 25px;
            margin: 12px auto;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            max-width: 350px;
        }

        .work-btn:hover {
            background: #b30000;
            transform: scale(1.03);
            transition: 0.2s;
        }

        .back-btn {
            display: inline-block;
            margin-top: 25px;
            background: transparent;
            color: #cc3333;
            border: 2px solid #cc3333;
            padding: 10px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
        }

        .back-btn:hover {
            background: #cc3333;
            color: white;
        }
    </style>
</head>
<body>
    <div class="overlay"></div>

    <div class="nav-bar">
        <a href="/">Home</a>
        <a href="/profile">Profile</a>
        <a href="/works">Works</a>
        <a href="/contact">Contact</a>
    </div>

    <div class="container">
        <div class="card">
            <h2>My Programming Works</h2>
            <p>Select a project below:</p>

            <a href="/touppercase" class="work-btn"> Convert to Uppercase</a>
            <a href="/area" class="work-btn"> Area Calculations</a>
            <a href="/linklist" class="work-btn"> Link List Operations</a>

            <a href="/" class="back-btn">← Back to Home</a>
        </div>
    </div>
</body>
</html>
