<!DOCTYPE html>
<html>
<head>
    <title>Linked List Operations</title>
    <style>
        body {
            font-family: "Times New Roman", Times, serif;
            background: url("/static/gwen.jfif") no-repeat center center fixed;
            background-size: cover;
            margin: 0;
            padding: 0;
            color: white;
            min-height: 100vh;
        }
        .overlay {
            background: rgba(120, 0, 0, 0.5);
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%; z-index: 1;
        }
        .nav-bar {
            position: relative; z-index: 2;
            text-align: right;
            padding: 20px 40px;
        }
        .nav-bar a {
            color: white; text-decoration: none;
            margin-left: 25px; font-weight: bold;
            font-family: "Times New Roman", Times, serif;
        }
        .nav-bar a:hover { text-decoration: underline; }
        .container {
            position: relative; z-index: 2;
            max-width: 700px; margin: 50px auto;
            padding: 0 20px;
        }
        .card {
            background: rgba(255,255,255,0.9);
            border-radius: 20px; padding: 40px;
            box-shadow: 0 8px 32px rgba(100, 0, 0, 0.4);
            color: #660000;
            font-family: "Times New Roman", Times, serif;
        }
        h2 {
            color: #990000; margin-top: 0;
            border-bottom: 3px solid #cc3333;
            padding-bottom: 12px;
            font-family: "Times New Roman", Times, serif;
        }
        .current-list-title, h3 {
            font-size: 22px;
            font-weight: bold;
            color: #990000;
            margin: 25px 0 15px;
            text-align: left;
            font-family: "Times New Roman", Times, serif;
        }
        .list-display {
            background: linear-gradient(to right, #4d0000, #800000);
            border-radius: 12px; padding: 25px 20px;
            margin: 10px 0 25px; display: flex;
            align-items: center; flex-wrap: wrap;
            gap: 12px; color: white;
            font-family: "Times New Roman", Times, serif; font-size: 20px;
        }
        .head-box {
            background: #ff3333; color: white;
            padding: 10px 20px; border-radius: 8px;
            font-weight: bold;
            border: 2px solid #ff6666;
        }
        .node-box {
            background: #cc0000; color: white;
            padding: 10px 25px; border-radius: 8px;
            border: 2px solid #ff4444;
            white-space: nowrap;
        }
        .null-box {
            background: #660000; color: #ffcccc;
            padding: 10px 20px; border-radius: 8px;
            border: 2px solid #993333;
            opacity: 0.9;
        }
        .arrow {
            color: #ffcccc; font-weight: bold;
        }
        label {
            display: block; margin: 20px 0 8px;
            font-weight: bold; text-align: left;
            font-family: "Times New Roman", Times, serif;
        }
        input {
            width: 100%; padding: 12px;
            border: 2px solid #cc3333; border-radius: 8px;
            font-size: 16px; box-sizing: border-box;
            font-family: "Times New Roman", Times, serif;
        }
        .btn-container {
            text-align: center;
            margin-top: 15px;
        }
        .btn {
            background: #cc3333; color: white;
            padding: 12px 20px; border: none;
            border-radius: 8px; font-weight: bold;
            cursor: pointer; margin: 0 8px;
            font-size: 15px;
            font-family: "Times New Roman", Times, serif;
        }
        .btn:hover { background: #b30000; }
        .btn.del { background: #990000; }
        .btn.del:hover { background: #730000; }
        .btn.clear { background: #660000; }
        .btn.clear:hover { background: #4d0000; }
        .back-btn {
            display: inline-block; margin-top: 30px;
            border: 2px solid #cc3333; color: #cc3333;
            padding: 10px 25px; border-radius: 8px;
            text-decoration: none; font-weight: bold;
            font-family: "Times New Roman", Times, serif;
        }
        .back-btn:hover { background: #cc3333; color: white; }
    </style>
</head>
<body>
    <div class="overlay"></div>
    <div class="nav-bar">
        <a href="/">Home</a>
        <a href="/profile">Profile</a>
        <a href="/works">Works</a>
        <a href="/contact">Contact</a>
    </div>
    <div class="container">
        <div class="card">
            <h2> Linked List Operations</h2>
            <p style="color:#660000; font-family: 'Times New Roman', Times, serif;">Interact with the singly linked list using the controls below.</p>

            <div class="current-list-title">Current List</div>

            <div class="list-display">
                <span class="head-box">HEAD</span>
                <span class="arrow">→</span>
                {% if items %}
                    {% for item in items %}
                        <span class="node-box">{{ item }}</span>
                        <span class="arrow">→</span>
                    {% endfor %}
                {% endif %}
                <span class="null-box">NULL</span>
            </div>

            <h3>Controls</h3>
            <form method="POST">
                <label>Enter value:</label>
                <input type="text" name="value" placeholder="Type a value to add/delete..." required>
                <div class="btn-container">
                    <button type="submit" name="action" value="add" class="btn"> Add to List</button>
                    <button type="submit" name="action" value="delete" class="btn del"> Delete Value</button>
                    <button type="submit" name="action" value="clear" class="btn clear"> Clear All</button>
                </div>
            </form>

            <br>
            <div style="text-align: center;">
                <a href="/works" class="back-btn">← Back to Works</a>
            </div>
        </div>
    </div>
</body>
</html>
